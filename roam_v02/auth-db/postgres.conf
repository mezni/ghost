#----------------------------
# PostgreSQL Configuration
#----------------------------

# CONNECTIONS
max_connections = 200                   # Max client connections
superuser_reserved_connections = 3      # Reserved for admin
listen_addresses = '*'                  # Listen on all interfaces
port = 5432                             # Default port

# RESOURCE USAGE
shared_buffers = 4GB                    # 25% of total RAM (adjust based on system)
work_mem = 16MB                         # Memory for each operation
maintenance_work_mem = 512MB            # For maintenance operations
effective_cache_size = 12GB             # 75% of total RAM

# WRITE-AHEAD LOG
wal_level = replica                     # Needed for replication
synchronous_commit = remote_write       # Good balance of durability/performance
wal_buffers = 16MB                      # Default is -1 (1/32 of shared_buffers)
checkpoint_timeout = 15min              # Time between checkpoints
max_wal_size = 4GB                      # Max WAL size before checkpoint
min_wal_size = 2GB                      # Min WAL size to keep

# REPLICATION (for production)
max_wal_senders = 4                     # Max number of WAL sender processes
wal_keep_size = 2GB                     # How much WAL to retain for replicas

# QUERY TUNING
random_page_cost = 1.1                  # Lower for SSD storage
effective_io_concurrency = 200          # For SSDs
max_worker_processes = 8                # For parallel queries
max_parallel_workers_per_gather = 4     # Parallel query workers

# AUTOVACUUM
autovacuum = on                         
autovacuum_max_workers = 6              # Max autovacuum processes
autovacuum_naptime = 15s                # Time between autovacuum runs
autovacuum_vacuum_threshold = 50        # Min # of updates to trigger vacuum
autovacuum_analyze_threshold = 50       # Min # of updates to trigger analyze

# LOGGING
log_destination = 'stderr'              # Log to standard error
logging_collector = on                  # Enable log collection
log_directory = 'pg_log'                # Directory for log files
log_filename = 'postgresql-%Y-%m-%d.log'
log_truncate_on_rotation = on           # Overwrite existing logs
log_rotation_age = 1d                   # Daily log rotation
log_min_duration_statement = 1000       # Log slow queries (>1sec)
log_checkpoints = on                    # Log checkpoint activity
log_connections = on                    # Log connection attempts
log_disconnections = on                 # Log session terminations

# TEMPLATE FOR AUTH SERVICE
password_encryption = scram-sha-256     # Secure password hashing
shared_preload_libraries = 'pg_stat_statements'  # For query monitoring

# LOCK MANAGEMENT
deadlock_timeout = 1s                   # Time to wait for lock before checking for deadlock
max_locks_per_transaction = 128         # For concurrent migrations

# CUSTOM FOR AUTH SERVICE
idle_in_transaction_session_timeout = 10min  # Prevent long-running idle tx
statement_timeout = 30s                 # Cancel queries running too long
lock_timeout = 10s                      # Fail if can't get lock quickly