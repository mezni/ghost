<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-12">
            <!-- Table Card -->
            <div class="card table-card">
                <div class="card-header border-0">
                    <div class="d-flex justify-content-between">
                        <h3 class="card-title">Countries Management</h3>
                        <div>
                            <button class="btn btn-primary btn-sm me-2" onclick="addNewCountry()">
                                <i class="bi bi-plus-circle"></i> Add Country
                            </button>
                            <a href="javascript:void(0);" class="link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">View All</a>
                        </div>
                    </div>
                </div>
                
                <!-- ADD THIS FILTER SECTION -->
                <div class="card-body border-bottom">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="isoFilter" class="form-label small text-muted">Filter by ISO Code</label>
                            <input type="text" class="form-control form-control-sm" id="isoFilter" placeholder="Enter ISO code (e.g., US, FR)" oninput="CountriesApp.applyFilters()">
                        </div>
                        <div class="col-md-6">
                            <label for="countryFilter" class="form-label small text-muted">Filter by Country Name</label>
                            <input type="text" class="form-control form-control-sm" id="countryFilter" placeholder="Enter country name" oninput="CountriesApp.applyFilters()">
                        </div>
                    </div>
                    <div class="mt-2 d-flex justify-content-between align-items-center">
                        <small class="text-muted" id="filter-info">Type to filter countries</small>
                        <button class="btn btn-outline-secondary btn-sm" onclick="CountriesApp.clearFilters()">
                            <i class="bi bi-x-circle"></i> Clear Filters
                        </button>
                    </div>
                </div>
                <!-- END OF FILTER SECTION -->

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th scope="col">Country ID</th>
                                    <th scope="col">ISO Code</th>
                                    <th scope="col">Country Name</th>
                                    <th scope="col" class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="country-table-body">
                                <!-- Table rows will be populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="d-flex justify-content-between align-items-center p-3 border-top">
                        <div class="text-muted">
                            Showing <span id="showing-from">0</span> to <span id="showing-to">0</span> of <span id="total-items">0</span> entries
                        </div>
                        <nav>
                            <ul class="pagination mb-0" id="pagination">
                                <!-- Pagination will be populated by JavaScript -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
