<div class="d-flex justify-content-between mb-3">
  <button class="btn btn-success" id="addNetworkBtn">
    <i class="fas fa-plus"></i> Add Network
  </button>
  <input type="text" id="networkSearch" class="form-control w-25" placeholder="Search networks...">
</div>

<table id="networksTable" class="table table-striped">
  <thead>
    <tr>
      <th>#</th>
      <th>Country Name</th>
      <th>Operator Name</th>
      <th>PLMN</th>
      <th>MCC</th>
      <th>MNC</th>
      <th>2G</th>
      <th>3G</th>
      <th>LTE</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="d-flex justify-content-between align-items-center">
  <button class="btn btn-outline-secondary" id="prevPageBtnNet">Previous</button>
  <span id="paginationInfoNet"></span>
  <button class="btn btn-outline-secondary" id="nextPageBtnNet">Next</button>
</div>

<!-- Modal -->
<div class="modal fade" id="networkModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="networkModalLabel" class="modal-title">Add Network</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="networkForm">
          <input type="hidden" id="networkId">
          <div class="mb-3">
            <label for="networkCountry" class="form-label">Country Name</label>
            <select id="networkCountry" class="form-control" required>
              <option value="">Select a country</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="networkOperator" class="form-label">Operator Name</label>
            <select id="networkOperator" class="form-control" required>
              <option value="">Select an operator</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="plmnCode" class="form-label">PLMN Code</label>
            <input type="text" id="plmnCode" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="plmn" class="form-label">PLMN</label>
            <input type="text" id="plmn" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="mcc" class="form-label">MCC</label>
            <input type="text" id="mcc" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="mnc" class="form-label">MNC</label>
            <input type="text" id="mnc" class="form-control" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" id="tech2G" class="form-check-input">
            <label class="form-check-label" for="tech2G">2G</label>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" id="tech3G" class="form-check-input">
            <label class="form-check-label" for="tech3G">3G</label>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" id="techLTE" class="form-check-input">
            <label class="form-check-label" for="techLTE">LTE</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="saveNetworkBtn">Save</button>
      </div>
    </div>
  </div>
</div>
