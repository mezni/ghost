<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoamAdmin - Analytics Dashboard</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/plugins/adminlte/css/adminlte.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
    <div class="wrapper">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <!-- Sidebar -->
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <div class="content-wrapper">
            <!-- Content Header -->
            <div class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 id="page-title" class="m-0 text-dark">Dashboard</h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-right" id="breadcrumb">
                                <li class="breadcrumb-item"><a href="#" data-page="dashboard">Home</a></li>
                                <li class="breadcrumb-item active" id="breadcrumb-active">Dashboard</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <section class="content">
                <div class="container-fluid">
                    <div id="content-area">
                        <!-- Dynamic content will be loaded here -->
                        <div class="row">
                            <div class="col-12 text-center">
                                <div class="loading-content">
                                    <i class="fas fa-sync fa-spin fa-2x text-primary mb-3"></i>
                                    <p class="text-muted">Loading dashboard...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- Footer -->
        <div id="footer-placeholder"></div>

        <!-- Loading Spinner Modal -->
        <div class="modal fade" id="loadingModal" data-backdrop="static" data-keyboard="false">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-body text-center">
                        <i class="fas fa-sync fa-spin fa-2x text-primary mb-3"></i>
                        <p>Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="assets/plugins/jquery/jquery.min.js"></script>
    <script src="assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/plugins/adminlte/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/app.js"></script>
    
    <!-- Page-specific scripts will be dynamically loaded -->
</body>
</html>
