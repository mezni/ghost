<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Country Management</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Toastr -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <!-- Content Header -->
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1>Country Management</h1>
                    </div>
                </div>
            </div>
        </section>

        <!-- Main content -->
        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Countries List</h3>
                                <button class="btn btn-primary float-right" data-toggle="modal" data-target="#addCountryModal">
                                    <i class="fas fa-plus"></i> Add Country
                                </button>
                            </div>
                            <div class="card-body">
                                <table id="countriesTable" class="table table-bordered table-striped">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Name</th>
                                            <th>Code</th>
                                            <th>Phone Code</th>
                                            <th>Currency</th>
                                            <th>Status</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Countries will be loaded via JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Add Country Modal -->
    <div class="modal fade" id="addCountryModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Country</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="addCountryForm">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="countryName">Country Name *</label>
                            <input type="text" class="form-control" id="countryName" required>
                        </div>
                        <div class="form-group">
                            <label for="countryCode">Country Code (ISO) *</label>
                            <input type="text" class="form-control" id="countryCode" required maxlength="2" placeholder="US, IN, etc.">
                        </div>
                        <div class="form-group">
                            <label for="phoneCode">Phone Code</label>
                            <input type="text" class="form-control" id="phoneCode" placeholder="+1, +91, etc.">
                        </div>
                        <div class="form-group">
                            <label for="currency">Currency</label>
                            <input type="text" class="form-control" id="currency" placeholder="USD, INR, etc.">
                        </div>
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select class="form-control" id="status">
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Country Modal -->
    <div class="modal fade" id="editCountryModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Country</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="editCountryForm">
                    <input type="hidden" id="editCountryId">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="editCountryName">Country Name *</label>
                            <input type="text" class="form-control" id="editCountryName" required>
                        </div>
                        <div class="form-group">
                            <label for="editCountryCode">Country Code (ISO) *</label>
                            <input type="text" class="form-control" id="editCountryCode" required maxlength="2">
                        </div>
                        <div class="form-group">
                            <label for="editPhoneCode">Phone Code</label>
                            <input type="text" class="form-control" id="editPhoneCode">
                        </div>
                        <div class="form-group">
                            <label for="editCurrency">Currency</label>
                            <input type="text" class="form-control" id="editCurrency">
                        </div>
                        <div class="form-group">
                            <label for="editStatus">Status</label>
                            <select class="form-control" id="editStatus">
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<!-- DataTables -->
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap4.min.js"></script>
<!-- Toastr -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

<script>
$(document).ready(function() {
    // Mock data storage
    let countries = [
        { id: 1, name: "United States", code: "US", phone_code: "+1", currency: "USD", status: 1 },
        { id: 2, name: "India", code: "IN", phone_code: "+91", currency: "INR", status: 1 },
        { id: 3, name: "United Kingdom", code: "UK", phone_code: "+44", currency: "GBP", status: 1 },
        { id: 4, name: "Japan", code: "JP", phone_code: "+81", currency: "JPY", status: 0 }
    ];
    
    let nextId = 5; // For new country IDs
    
    // Initialize DataTable
    var table = $('#countriesTable').DataTable({
        "paging": true,
        "lengthChange": true,
        "searching": true,
        "ordering": true,
        "info": true,
        "autoWidth": false,
        "responsive": true,
        "data": countries,
        "columns": [
            { "data": "id" },
            { "data": "name" },
            { "data": "code" },
            { "data": "phone_code" },
            { "data": "currency" },
            { 
                "data": "status",
                "render": function(data, type, row) {
                    return data == 1 ? 
                        '<span class="badge badge-success">Active</span>' : 
                        '<span class="badge badge-danger">Inactive</span>';
                }
            },
            {
                "data": null,
                "render": function(data, type, row) {
                    return `
                        <button class="btn btn-sm btn-primary edit-btn" data-id="${row.id}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-danger delete-btn" data-id="${row.id}">
                            <i class="fas fa-trash"></i>
                        </button>
                    `;
                },
                "orderable": false
            }
        ]
    });

    // Add new country
    $('#addCountryForm').submit(function(e) {
        e.preventDefault();
        
        const newCountry = {
            id: nextId++,
            name: $('#countryName').val(),
            code: $('#countryCode').val(),
            phone_code: $('#phoneCode').val(),
            currency: $('#currency').val(),
            status: parseInt($('#status').val())
        };
        
        countries.push(newCountry);
        table.row.add(newCountry).draw();
        
        $('#addCountryModal').modal('hide');
        $('#addCountryForm')[0].reset();
        toastr.success('Country added successfully');
    });

    // Edit country - open modal
    $(document).on('click', '.edit-btn', function() {
        const countryId = parseInt($(this).data('id'));
        const country = countries.find(c => c.id === countryId);
        
        if (country) {
            $('#editCountryId').val(country.id);
            $('#editCountryName').val(country.name);
            $('#editCountryCode').val(country.code);
            $('#editPhoneCode').val(country.phone_code);
            $('#editCurrency').val(country.currency);
            $('#editStatus').val(country.status);
            
            $('#editCountryModal').modal('show');
        }
    });

    // Edit country - submit
    $('#editCountryForm').submit(function(e) {
        e.preventDefault();
        
        const countryId = parseInt($('#editCountryId').val());
        const countryIndex = countries.findIndex(c => c.id === countryId);
        
        if (countryIndex !== -1) {
            countries[countryIndex] = {
                id: countryId,
                name: $('#editCountryName').val(),
                code: $('#editCountryCode').val(),
                phone_code: $('#editPhoneCode').val(),
                currency: $('#editCurrency').val(),
                status: parseInt($('#editStatus').val())
            };
            
            table.ajax.reload(); // Refresh the table
            $('#editCountryModal').modal('hide');
            toastr.success('Country updated successfully');
        }
    });

    // Delete country
    $(document).on('click', '.delete-btn', function() {
        const countryId = parseInt($(this).data('id'));
        
        if (confirm('Are you sure you want to delete this country?')) {
            countries = countries.filter(c => c.id !== countryId);
            table.ajax.reload(); // Refresh the table
            toastr.success('Country deleted successfully');
        }
    });

    // Toastr options
    toastr.options = {
        "closeButton": true,
        "progressBar": true,
        "positionClass": "toast-top-right",
        "timeOut": "3000"
    };
});
</script>
</body>
</html>
