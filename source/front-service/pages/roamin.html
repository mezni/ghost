<!-- Row to hold both charts -->
<div class="row">
    <!-- Flex container for both charts to ensure equal height -->
    <div class="col-lg-8 col-12 mb-4">
        <!-- Line Chart for Roamers IN -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Roamers IN Trend</h3>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="roamersLineChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-4 col-12 mb-4">
        <!-- Pie Chart for Roamers Distribution -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Roamers IN by Country</h3>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="roamersPieChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- New Row with Filter Inside "Filtered Data by Country" -->
<div class="row">
    <!-- Chart Container for Filtered Data -->
    <div class="col-lg-12 col-12 mb-4">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Filtered Data by Country</h3>
                <!-- Label and Filter Dropdown side by side -->
                <div class="d-flex align-items-center">
                    <div class="form-group mb-0 mr-3 ml-auto">
                        <label for="countryFilter" class="mb-0">Select Country</label>
                    </div>
                    <!-- Filter moved to the right -->
                    <div class="form-group mb-0 ml-auto">
                        <select id="countryFilter" class="form-control">
                            <option value="">Select Country</option>
                            <option value="USA">USA</option>
                            <option value="Canada">Canada</option>
                            <option value="Germany">Germany</option>
                            <option value="India">India</option>
                            <!-- Add more countries here -->
                        </select>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <!-- Chart container for displaying filtered data -->
                <div class="chart-container">
                    <canvas id="filteredChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
