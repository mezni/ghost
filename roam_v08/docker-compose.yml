services:
  roam-db:
    build:
      context: ./roam-db
      dockerfile: Dockerfile
    container_name: roam-db
    restart: always
    environment:
      POSTGRES_USER: ${ROAM_DB_USER}
      POSTGRES_PASSWORD: ${ROAM_DB_PASSWORD}
      POSTGRES_DB: ${ROAM_DB_NAME}
    ports:
      - "${ROAM_DB_PORT}:5432"
    volumes:
      - roam_db_data:/var/lib/postgresql/data
      - ./roam-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - delta_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROAM_DB_USER} -d ${ROAM_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  roam_db_data:

networks:
  delta_network:
    driver: bridge
