<div class="d-flex justify-content-between mb-3">
  <button class="btn btn-success" id="addPrefixBtn">
    <i class="fas fa-plus"></i> Add Prefix
  </button>
  <input type="text" id="prefixSearch" class="form-control w-25" placeholder="Search prefixes...">
</div>

<table id="prefixesTable" class="table table-striped">
  <thead>
    <tr>
      <th>#</th>
      <th>Country Name</th>
      <th>Operator Name</th>
      <th>Prefix</th>
      <th>Valid</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="d-flex justify-content-between align-items-center">
  <button class="btn btn-outline-secondary" id="prevPageBtnPrefix">Previous</button>
  <span id="paginationInfoPrefix"></span>
  <button class="btn btn-outline-secondary" id="nextPageBtnPrefix">Next</button>
</div>

<!-- Modal -->
<div class="modal fade" id="prefixModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="prefixModalLabel" class="modal-title">Add Prefix</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="prefixForm">
          <input type="hidden" id="prefixId">
          <div class="mb-3">
            <label for="prefixCountry" class="form-label">Country Name</label>
            <select id="prefixCountry" class="form-control" required>
              <option value="">Select a country</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="prefixOperator" class="form-label">Operator Name</label>
            <select id="prefixOperator" class="form-control" required>
              <option value="">Select an operator</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="prefix" class="form-label">Prefix</label>
            <input type="text" id="prefix" class="form-control" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" id="isValid" class="form-check-input">
            <label class="form-check-label" for="isValid">Valid</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="savePrefixBtn">Save</button>
      </div>
    </div>
  </div>
</div>
