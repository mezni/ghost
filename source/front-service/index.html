<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoamAdmin Dashboard</title>

  <!-- =======================
       CSS Dependencies
  ======================= -->
  <!-- Font Awesome -->
  <link rel="stylesheet" href="assets/plugins/fontawesome-free/css/all.min.css" />
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  
  <!-- AdminLTE Core -->
  <link rel="stylesheet" href="assets/plugins/adminlte/css/adminlte.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css" />

  <!-- Favicon -->
  <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />
</head>

<body class="hold-transition sidebar-mini layout-fixed">
  <div class="wrapper">
    
    <!-- Header -->
    <div id="header"></div>

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <!-- Content Wrapper -->
    <main class="content-wrapper">
      <!-- Page Header -->
      <section class="content-header">
        <div class="container-fluid">
          <div class="row mb-2 align-items-center">
            <div class="col-sm-6">
              <h1 class="m-0">Dashboard</h1>
            </div>
            <div class="col-sm-6">
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb float-sm-right mb-0">
                  <li class="breadcrumb-item"><a href="#">Home</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Dashboard</li>
                </ol>
              </nav>
            </div>
          </div>
        </div>
      </section>

      <!-- Main Content Area -->
      <section class="content" id="content-area">
        <!-- Dynamic content will be loaded here -->
        <div class="container-fluid">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
              <h3 class="card-title mb-0">
                <i class="fas fa-tachometer-alt me-2"></i>Welcome to RoamAdmin
              </h3>
            </div>
            <div class="card-body">
              <p class="mb-3">This is your main dashboard area. Use the sidebar to navigate.</p>
              <button class="btn btn-primary" id="demoButton">
                <i class="fas fa-rocket me-2"></i>Click Me!
              </button>
              <div id="demoMessage" class="mt-3 d-none">
                <div class="alert alert-success mb-0">
                  <i class="fas fa-check-circle me-2"></i>Button clicked! Custom JavaScript is working.
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <div id="footer"></div>
  </div>

  <!-- =======================
       JS Dependencies
  ======================= -->
  <!-- jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  
  <!-- Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- AdminLTE -->
  <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.2.0/dist/js/adminlte.min.js"></script>

  <!-- Custom JS -->
  <script src="js/app.js"></script>
</body>
</html>
