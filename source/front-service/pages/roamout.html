<div class="row">
    <!-- Flex container for both charts to ensure equal height -->
    <div class="col-lg-8 col-12 mb-4">
        <!-- Line Chart for Roamers OUT -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Roamers OUT Trend</h3>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="roamersOutLineChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-4 col-12 mb-4">
        <!-- Pie Chart for Roamers OUT by Country -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Roamers OUT by Country</h3>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="roamersOutPieChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
