<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title">Countries Management</h3>
        <button class="btn btn-primary btn-sm" id="addCountryBtn">
          <i class="fas fa-plus"></i> Add Country
        </button>
      </div>

      <!-- Search Box -->
      <div class="card-body pt-2 pb-0">
        <div class="row mb-2">
          <div class="col-md-4">
            <input type="text" id="countrySearch" class="form-control" placeholder="Search countries...">
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card-body table-responsive p-0">
        <table class="table table-hover text-nowrap" id="countriesTable">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>ISO Code</th>
              <th>Country Name</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4" class="text-center">Loading countries...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="card-footer d-flex justify-content-between align-items-center">
        <div>
          <span id="paginationInfo"></span>
        </div>
        <div>
          <button class="btn btn-sm btn-outline-secondary" id="prevPageBtn">Prev</button>
          <button class="btn btn-sm btn-outline-secondary" id="nextPageBtn">Next</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Country Modal -->
<div class="modal fade" id="countryModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="countryModalLabel">Edit Country</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="countryForm">
          <input type="hidden" id="countryId">
          <div class="mb-3">
            <label for="countryCode" class="form-label">ISO Code</label>
            <input type="text" class="form-control" id="countryCode" required>
          </div>
          <div class="mb-3">
            <label for="countryName" class="form-label">Country Name</label>
            <input type="text" class="form-control" id="countryName" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="saveCountryBtn">Save</button>
      </div>
    </div>
  </div>
</div>
