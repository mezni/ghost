<div class="container-fluid">
  <!-- Row 1: Global Trend & Distribution By Country -->
  <div class="row mt-3">
    <!-- Global Trend Line Chart (8 cols) -->
    <div class="col-lg-8 col-md-12">
      <div class="card mb-4 card-custom shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">Global Trend</h5>
          <div class="card-tools d-flex align-items-center">
            <button type="button" class="btn btn-tool" data-lte-toggle="card-collapse">
              <i data-lte-icon="expand" class="bi bi-plus-lg"></i>
              <i data-lte-icon="collapse" class="bi bi-dash-lg"></i>
            </button>
            <button type="button" class="btn btn-tool" data-lte-toggle="card-remove">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>
        <div class="card-body" style="height: 350px;">
          <canvas id="roamOutLineChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Distribution By Country Pie Chart (4 cols) -->
    <div class="col-lg-4 col-md-12">
      <div class="card mb-4 card-custom shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">Distribution By Country</h5>
          <div class="card-tools d-flex align-items-center">
            <button type="button" class="btn btn-tool" data-lte-toggle="card-collapse">
              <i data-lte-icon="expand" class="bi bi-plus-lg"></i>
              <i data-lte-icon="collapse" class="bi bi-dash-lg"></i>
            </button>
            <button type="button" class="btn btn-tool" data-lte-toggle="card-remove">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>
        <div class="card-body" style="height: 350px;">
          <canvas id="roamOutPieChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Row 2: Country Trend & New Pie Chart / Metric -->
  <div class="row mt-4">
    <!-- Country Trend Line Chart (8 cols) -->
    <div class="col-md-8">
      <div class="card mb-4 card-custom shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">Country Trend</h5>

          <!-- Country Filter -->
          <div class="d-flex align-items-center">
            <label for="countryFilterOut" class="me-2 fw-semibold mb-0">Country:</label>
            <select id="countryFilterOut" class="form-select form-select-sm" style="width: 160px;">
              <!-- Options populated dynamically -->
            </select>
          </div>
        </div>
        <div class="card-body" style="height: 300px;">
          <canvas id="country-line-chart-out"></canvas>
        </div>
      </div>
    </div>

    <!-- New Pie Chart / Metric (4 cols) -->
    <div class="col-md-4">
      <div class="card mb-4 card-custom shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0" id="distributionTitleOut">Distribution</h5>
          <div class="card-tools d-flex align-items-center">
            <button type="button" class="btn btn-tool" data-lte-toggle="card-collapse">
              <i data-lte-icon="expand" class="bi bi-plus-lg"></i>
              <i data-lte-icon="collapse" class="bi bi-dash-lg"></i>
            </button>
          </div>
        </div>
        <div class="card-body" style="height: 300px;">
          <canvas id="new-pie-chart-out"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
