<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countries Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="dist/css/adminlte.min.css">
  <link rel="stylesheet" href="plugins/bootstrap/css/bootstrap.min.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Content Wrapper -->
  <div class="content-wrapper pt-4">
    <section class="content">
      <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="mb-0">Countries Management</h2>
          <button class="btn btn-primary" data-toggle="modal" data-target="#addCountryModal">
            <i class="fas fa-plus mr-1"></i> Add Country
          </button>
        </div>

        <div class="card shadow">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover table-bordered table-striped" id="countriesTable">
                <thead class="thead-light">
                  <tr>
                    <th>ID</th>
                    <th>Country Name</th>
                    <th>ISO Code</th>
                    <th style="width: 100px;">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Rows will be populated by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </section>
  </div>

  <!-- Country Modal -->
  <div class="modal fade" id="addCountryModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <form id="countryForm" class="w-100">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add / Edit Country</h5>
            <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="countryId" name="id">
            <div class="form-group">
              <label for="countryName">Country Name</label>
              <input type="text" class="form-control" id="countryName" name="name" required>
            </div>
            <div class="form-group">
              <label for="isoCode">ISO Code</label>
              <input type="text" class="form-control" id="isoCode" name="iso_code" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          </div>
        </div>
      </form>
    </div>
  </div>

</div>

<!-- Scripts -->
<script src="plugins/jquery/jquery.min.js"></script>
<script src="plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="dist/js/adminlte.min.js"></script>
<script src="js/countries.js"></script>
</body>
</html>
