[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dotenv = "0.15"
tokio-postgres = { version = "0.7.13", features = ["with-uuid-1"] }
deadpool-postgres = "0.14.1"

