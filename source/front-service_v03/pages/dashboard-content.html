<!-- pages/dashboard-content.html -->
<section class="content">
    <div class="container-fluid">
        <!-- Stat boxes -->
        <div class="row">
            <!-- Roamers IN -->
            <div class="col-lg-3 col-6">
                <div class="small-box bg-info text-white" id="roamers-in-box">
                    <div class="inner">
                        <h3 id="roamers-in-value">30,000</h3>
                        <p>Roamers IN</p>
                        <small id="roamers-in-date">Last refresh: 2025-09-10</small>
                    </div>
                    <div class="icon">
                        <i class="fas fa-sign-in-alt"></i>
                    </div>
                    <a href="#" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>

            <!-- Roamers OUT -->
            <div class="col-lg-3 col-6">
                <div class="small-box bg-success text-white" id="roamers-out-box">
                    <div class="inner">
                        <h3 id="roamers-out-value">30,000</h3>
                        <p>Roamers OUT</p>
                        <small id="roamers-out-date">Last refresh: 2025-09-10</small>
                    </div>
                    <div class="icon">
                        <i class="fas fa-sign-out-alt"></i>
                    </div>
                    <a href="#" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>

            <!-- Alerts (Red) -->
            <div class="col-lg-3 col-6">
                <div class="small-box bg-danger text-white">
                    <div class="inner">
                        <h3>44</h3>
                        <p>Alerts</p>
                        <small id="alerts-date">Last refresh: 2025-09-10</small>
                    </div>
                    <div class="icon"><i class="fas fa-exclamation-triangle"></i></div>
                    <a href="#" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>

            <!-- Notifications (Yellow) -->
            <div class="col-lg-3 col-6">
                <div class="small-box bg-warning text-white">
                    <div class="inner">
                        <h3>65</h3>
                        <p>Notifications</p>
                        <small id="notifications-date">Last refresh: 2025-09-10</small>
                    </div>
                    <div class="icon"><i class="fas fa-bell"></i></div>
                    <a href="#" class="small-box-footer">More info <i class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Roamers IN</h3>
                    </div>
                    <div class="card-body">
                        <canvas id="visitorsChart" style="height:250px"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Sales</h3>
                    </div>
                    <div class="card-body">
                        <canvas id="salesChart" style="height:250px"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
