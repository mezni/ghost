services:
  auth-db:
    build:
      context: ./auth-db
      dockerfile: Dockerfile
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./auth-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - delta_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - RUST_LOG=info
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-development}
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - delta_network

volumes:
  auth_db_data:

networks:
  delta_network:
    driver: bridge
