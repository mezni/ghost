<div class="d-flex justify-content-between mb-3">
  <button class="btn btn-success" id="addSorPlanBtn">
    <i class="fas fa-plus"></i> Add SOR Plan
  </button>
  <input type="text" id="sorPlanSearch" class="form-control w-25" placeholder="Search SOR plans...">
</div>

<table id="sorPlanTable" class="table table-striped">
  <thead>
    <tr>
      <th>#</th>
      <th>Country Name</th>
      <th>Operator Name</th>
      <th>Routage Type</th>
      <th>Barring</th>
      <th>Rate</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <!-- Rows will be populated dynamically -->
  </tbody>
</table>

<div class="d-flex justify-content-between align-items-center">
  <button class="btn btn-outline-secondary" id="prevPageBtnSP">Previous</button>
  <span id="paginationInfoSP"></span>
  <button class="btn btn-outline-secondary" id="nextPageBtnSP">Next</button>
</div>

<!-- Modal -->
<div class="modal fade" id="sorPlanModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="sorPlanModalLabel" class="modal-title">Add SOR Plan</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="sorPlanForm">
          <input type="hidden" id="sorPlanId">

          <div class="mb-3">
            <label for="sorPlanOperator" class="form-label">Operator Name</label>
            <select id="sorPlanOperator" class="form-control" required>
              <option value="">Select an operator</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="sorPlanRoutage" class="form-label">Routage Type</label>
            <select id="sorPlanRoutage" class="form-control" required>
              <option value="">Select a routage type</option>
            </select>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" id="sorPlanBarring" class="form-check-input">
            <label class="form-check-label" for="sorPlanBarring">Barring</label>
          </div>

          <div class="mb-3">
            <label for="sorPlanRate" class="form-label">Rate</label>
            <input type="text" id="sorPlanRate" class="form-control" required>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" id="sorPlanCurrent" class="form-check-input">
            <label class="form-check-label" for="sorPlanCurrent">Is Current</label>
          </div>

        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="saveSorPlanBtn">Save</button>
      </div>
    </div>
  </div>
</div>
