[package]
name = "back-service"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

