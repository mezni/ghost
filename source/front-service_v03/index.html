<!-- pages/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoamAdmin Dashboard</title>
    <link rel="stylesheet" href="assets/plugins/adminlte/css/adminlte.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="assets/plugins/fontawesome-free/css/all.min.css">
</head>
<body class="hold-transition sidebar-mini">
    <div class="wrapper">

        <!-- Load Header -->
        <div id="header-placeholder"></div>

        <!-- Load Sidebar -->
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1>Dashboard</h1>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Main content section (where the dynamic content will go) -->
            <section class="content" id="main-content-placeholder">
                <!-- Dynamic content will be loaded here -->
            </section>
        </div>

        <!-- Load Footer -->
        <div id="footer-placeholder"></div>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
