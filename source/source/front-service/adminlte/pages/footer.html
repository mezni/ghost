<!-- Main Footer -->
<footer class="main-footer text-center py-3">
  <div class="container">
    <strong>Copyright &copy; 
      <span id="current-year"></span> 
      <a href="#" class="text-primary text-decoration-none">RoamAdmin</a>.
    </strong>
    All rights reserved.
    <div class="mt-1 small text-muted">
      <span id="user-status">Logged in as: Admin</span>
    </div>
  </div>
</footer>

<script>
  // Dynamically update year and user status
  document.addEventListener('DOMContentLoaded', function() {
    // Update year
    document.getElementById('current-year').textContent = new Date().getFullYear();
    
    // Update user status
    const authData = JSON.parse(localStorage.getItem('roamadmin_auth') || sessionStorage.getItem('roamadmin_auth'));
    const userStatus = document.getElementById('user-status');
    
    if (authData && authData.username && userStatus) {
      userStatus.textContent = `Logged in as: ${authData.username}`;
    }
  });
</script>
