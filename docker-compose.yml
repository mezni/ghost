services:
  database:
    build:
      context: ./source
      dockerfile: roamdb-service/Dockerfile
    image: gamma/roamdb:latest
    container_name: roamdb-service
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${ROAM_DB_USER}
      POSTGRES_PASSWORD: ${ROAM_DB_PASSWORD}
      POSTGRES_DB: ${ROAM_DB_NAME}
    volumes:
      - roamdb_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./config/countries.csv:/countries.csv
    networks:
      - gamma_network

volumes:
  roamdb_data:

networks:
  gamma_network: