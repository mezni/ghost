<!-- Dashboard Page -->
<div class="container-fluid">
  <!-- Row 1: Overview Stats -->
  <div class="row">
    <div class="col-xl-3 col-md-6 col-12">
      <div class="card card-gradient-primary">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title mb-1">Total Roam IN</h5>
            <h2 id="roamInCount">0</h2>
          </div>
          <i class="bi bi-arrow-down-left-circle-fill text-primary fs-2"></i>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 col-12">
      <div class="card card-gradient-success">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title mb-1">Total Roam OUT</h5>
            <h2 id="roamOutCount">0</h2>
          </div>
          <i class="bi bi-arrow-up-right-circle-fill text-success fs-2"></i>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 col-12">
      <div class="card card-gradient-warning">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title mb-1">Anomalies</h5>
            <h2 id="anomalyCount">0</h2>
          </div>
          <i class="bi bi-exclamation-triangle-fill text-warning fs-2"></i>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 col-12">
      <div class="card card-gradient-info">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title mb-1">Notifications</h5>
            <h2 id="notificationCount">0</h2>
          </div>
          <i class="bi bi-bell-fill text-info fs-2"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Row 2: Charts -->
  <div class="row">
    <div class="col-lg-8 col-12 mb-4">
      <div class="card">
        <div class="card-header border-0 d-flex justify-content-between align-items-center">
          <h3 class="card-title">Roamers IN / OUT Overview</h3>
          <div class="d-flex align-items-center">
            <label for="countrySelect" class="me-2 mb-0 small text-muted">Select Country:</label>
            <select id="countrySelect" class="form-select form-select-sm" onchange="DashboardApp.filterByCountry()">
              <option value="all">All</option>
            </select>
          </div>
        </div>
        <div class="card-body">
          <canvas id="roamOverviewChart" height="140"></canvas>
        </div>
      </div>
    </div>

    <div class="col-lg-4 col-12 mb-4">
      <div class="card">
        <div class="card-header border-0 d-flex justify-content-between align-items-center">
          <h3 class="card-title">Roamers by Country & Operator</h3>
          <a href="javascript:void(0);" class="link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">
            View All
          </a>
        </div>
        <div class="card-body">
          <canvas id="roamersByCountryChart" height="220"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Row 3: Recent Visitors -->
  <div class="row">
    <div class="col-12">
      <div class="card table-card">
        <div class="card-header border-0 d-flex justify-content-between align-items-center">
          <h3 class="card-title">Recent Visitors</h3>
          <a href="javascript:void(0);" class="link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">View All</a>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th scope="col">Visitor ID</th>
                  <th scope="col">Country</th>
                  <th scope="col">Device</th>
                  <th scope="col">Duration</th>
                  <th scope="col">Pages Viewed</th>
                  <th scope="col">Status</th>
                  <th scope="col" class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="recent-visitors-body">
                <!-- Populated dynamically by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Dashboard JS -->
<script src="js/dashboard.js"></script>
