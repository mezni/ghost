services:
  postgres:
    image: postgres:17
    container_name: roam_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./source/db-service/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./source/db-service/data/countries.csv:/countries.csv
      - ./source/db-service/data/operators.csv:/operators.csv      
      - ./source/db-service/data/prefixes.csv:/prefixes.csv      
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres_network

  data-generator:
    build:
      context: ./source
      dockerfile: tools/Dockerfile
    image: alpha/data-generator:latest
    container_name: data-generator
    volumes:
      - ./WORK/INPUT:/app/INPUT
      - ./source/db-service/init/roam_out_ref.txt:/app/roam_out_ref.txt
      - ./init/roam_out_ref.txt:/app/roam_out_ref.txt
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1

  loader-service:
    build:
      context: ./source
      dockerfile: loader-service/Dockerfile
    image: alpha/loader-service:latest
    container_name: loader-service
    volumes:
      - ./WORK/INPUT:/app/INPUT
      - ./WORK/REJECTED:/app/REJECTED
      - ./WORK/ARCHIVE:/app/ARCHIVE
      - ./.env:/app/.env 
      - ./config.yaml:/app/config.yaml 
    environment:
      - RUST_LOG=info

volumes:
  postgres_data:

networks:
  postgres_network:
