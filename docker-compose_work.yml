version: '3.8'

services:
  users-database:
    image: postgres:17.6
    container_name: users-database
    restart: always
    networks:
      - ev-net
    environment:
      POSTGRES_PASSWORD: users
      POSTGRES_USER: users
#      POSTGRES_DB: kong_db
      POSTGRES_MULTIPLE_DATABASES: users_db,kong_db
    volumes:
      - users_data:/var/lib/postgresql/data
      - ./config/users-db/:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "users"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  kong-migrations:
    image: kong:3.7.0  # Use specific version
    container_name: kong-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: users-database
      KONG_PG_USER: users
      KONG_PG_PASSWORD: users
      KONG_PG_DATABASE: kong_db
    command: "kong migrations bootstrap"
    depends_on:
      users-database:
        condition: service_healthy
    networks:
      - ev-net
    restart: on-failure

  kong:
    image: kong:3.7.0  # Use specific version
    restart: always
    networks:
      - ev-net
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: users-database
      KONG_PG_USER: users
      KONG_PG_PASSWORD: users
      KONG_PG_DATABASE: kong_db
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PROXY_LISTEN_SSL: 0.0.0.0:8443
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "8000:8000"   # Proxy
      - "8001:8001"   # Admin API
      - "8002:8002"   # Admin GUI
      - "8443:8443"   # SSL Proxy
      - "8444:8444"   # SSL Admin
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  konga:
    image: pantsel/konga:latest
    restart: always
    networks:
      - ev-net
    environment:
      DB_ADAPTER: postgres
      DB_HOST: users-database
      DB_USER: users
      DB_PASSWORD: users
      DB_DATABASE: users_db  # Konga uses users_db
      TOKEN_SECRET: 4b5ffb1b86049479d7bc875bcaf0a9b4fcfd1b16
      NODE_ENV: production
    depends_on:
      - users-database
      - kong
    ports:
      - "1337:1337"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ev-net:
    driver: bridge

volumes:
  users_data: