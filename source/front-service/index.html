<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoamAdmin Dashboard</title>

  <!-- =======================
       CSS Dependencies
  ======================= -->
  <!-- Font Awesome -->
  <link rel="stylesheet" href="assets/plugins/fontawesome-free/css/all.min.css" />
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  
  <!-- AdminLTE Core -->
  <link rel="stylesheet" href="assets/plugins/adminlte/css/adminlte.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css" />

  <!-- Favicon -->
  <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />
</head>

<body class="hold-transition sidebar-mini layout-fixed">
  <div class="wrapper">
    
    <!-- Header -->
    <div id="header"></div>

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <!-- Content Wrapper -->
    <main class="content-wrapper">
      <!-- Page Header -->
      <section class="content-header">
        <div class="container-fluid">
          <div class="row mb-2 align-items-center">
            <div class="col-sm-6">
              <h1 class="m-0" id="page-title">Dashboard</h1>
            </div>
            <div class="col-sm-6">
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb float-sm-right mb-0" id="breadcrumb-list">
                  <li class="breadcrumb-item"><a href="#">Home</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Dashboard</li>
                </ol>
              </nav>
            </div>
          </div>
        </div>
      </section>

      <!-- Main Content Area -->
      <section class="content">
        <div class="container-fluid" id="content-area">
          <!-- Dashboard default content -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <div id="footer"></div>
  </div>

  <!-- =======================
       JS Dependencies
  ======================= -->
  <!-- jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
  
  <!-- Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  
  <!-- AdminLTE -->
  <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.2.0/dist/js/adminlte.min.js" defer></script>

  <!-- Custom JS -->
  <script src="js/app.js" defer></script>
</body>
</html>
